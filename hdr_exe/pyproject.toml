[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-exe"
version = "0.1.0"
description = "Modular Core Architecture for HDR processing services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "websocket-client>=1.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
