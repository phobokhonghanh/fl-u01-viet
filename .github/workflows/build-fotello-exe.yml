name: Fotello EXE CI

on:
  push:
    branches: ["deploy/exe"]
    paths:
      - 'fotello/**'
      - '.github/workflows/build-fotello-exe.yml'
  workflow_dispatch:

jobs:
  build_fotello:
    runs-on: windows-latest
    steps:
      - name: Tải Code vào môi trường Build
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài đặt Thư viện, PyArmor và PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyarmor
          pip install -r fotello/requirements.txt

      - name: Obfuscate Python code bằng PyArmor
        working-directory: ./fotello
        run: |
          pyarmor gen `
            -O ..\build\fotello_protected `
            -r `
            main.py `
            browser_runtime.py `
            backend

      - name: Đóng gói Fotello đã bảo vệ thành file chạy (.exe)
        working-directory: ./build/fotello_protected
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name Fotello_Client `
            --add-data "..\..\fotello\ui;ui" `
            --add-data "..\..\fotello\settings.json;." `
            --paths "." `
            --hidden-import browser_runtime `
            --hidden-import backend `
            --hidden-import backend.auth `
            --hidden-import backend.browser_auth `
            --hidden-import backend.client `
            --hidden-import backend.constants `
            --hidden-import backend.downloads `
            --hidden-import backend.firestore `
            --hidden-import backend.fotello_api `
            --hidden-import backend.license `
            --hidden-import backend.service `
            --hidden-import webview.platforms.winforms `
            --hidden-import selenium.webdriver.chrome.service `
            --hidden-import selenium.webdriver.chrome.options `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module PySide2 `
            --exclude-module PySide6 `
            main.py

      - name: Lưu trữ file Fotello EXE
        uses: actions/upload-artifact@v4
        with:
          name: Fotello_Client
          path: build/fotello_protected/dist/Fotello_Client.exe
          retention-days: 7
