name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - deploy/cloudflare
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    # Strict guard: only run on deploy/cloudflare branch
    if: github.ref == 'refs/heads/deploy/cloudflare'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ce5dc6a2b2fc3c3ff65983a09b67f1c8' }}
          wranglerVersion: 'latest'
          workingDirectory: 'backend'

      - name: Dump Wrangler error logs on failure
        if: failure()
        run: |
          if [ -d "$HOME/.config/.wrangler/logs" ]; then
            echo "=== Wrangler Error Logs ==="
            cat $HOME/.config/.wrangler/logs/*.log
          fi
