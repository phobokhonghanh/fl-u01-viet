<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fotello License</title>
  <link rel="stylesheet" href="license.css">
</head>
<body>
  <main class="license-shell">
    <section class="license-panel">
      <div>
        <p class="eyebrow">Fotello Client</p>
        <h1>Kích hoạt license</h1>
        <p class="subtext">Nhập license key để mở màn hình chính.</p>
      </div>

      <form id="license-form" class="license-form">
        <label for="license-key">License key</label>
        <input id="license-key" type="password" autocomplete="off" placeholder="Nhập key của bạn">
        <button id="activate-btn" type="submit">Kích hoạt</button>
      </form>

      <p id="license-status" class="status">Đang kiểm tra license...</p>
    </section>
  </main>
  <script src="license.js"></script>
</body>
</html>
