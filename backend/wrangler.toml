name = "u01-viet-backend"
main = "app.py"

compatibility_date = "2024-04-03"
compatibility_flags = ["python_workers"]
account_id = "ce5dc6a2b2fc3c3ff65983a09b67f1c8"

[vars]
FRONTEND_BASE_URL = "https://u01-viet.vercel.app/"
KEYS_FILENAME = "viet_keys.json"
SEPAY_ENV = "production"
PRICE_LITE = "400.000 VNĐ / tháng"
PRICE_PLUS = "700.000 VNĐ / tháng"
MIN_CLIENT_VERSION = "2.0"
RETRY_MAX_ATTEMPTS = "10"
RETRY_INITIAL_DELAY = "15.0"
RETRY_BACKOFF_FACTOR = "1.5"


# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fl-u01-db"
database_id = "a0e08872-8d8a-438d-a5b6-48b9c51710bf"

# Cloudflare KV Namespace binding để lưu trữ keys
[[kv_namespaces]]
binding = "KEYS_KV"
id = "1a3c8f7063db47438f2754e5e74debfb"
